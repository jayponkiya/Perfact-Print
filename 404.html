  <script>
    /* Motion: cover the page until js/animations.js starts the CMYK wipe (removed after 3 s at most).
       Skipped entirely for visitors who prefer reduced motion. */
    (function (d) {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      d.classList.add("pp-motion", "pp-loading");
      setTimeout(function () { d.classList.remove("pp-loading"); }, 3000);
    })(document.documentElement);
  </script>
